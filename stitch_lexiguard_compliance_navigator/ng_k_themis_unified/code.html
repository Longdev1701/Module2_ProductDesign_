<body class="bg-background min-h-screen flex text-on-surface antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Split Screen Layout: Left Branding, Right Form -->
<div class="flex w-full min-h-screen">
<!-- Left Pane: Brand Identity (Hidden on small screens) -->
<div class="hidden lg:flex w-1/2 bg-primary relative flex-col items-center justify-center p-12 overflow-hidden">
<!-- Decorative background elements -->
<div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(circle at 2px 2px, white 1px, transparent 0); background-size: 32px 32px;"></div>
<div class="absolute top-0 left-0 w-full h-full bg-gradient-to-b from-transparent to-on-primary-fixed opacity-50"></div>
<div class="relative z-10 flex flex-col items-center text-center max-w-md">
<!-- Brand Logo Icon -->
<img alt="Themis Logo" class="w-64 h-auto mb-8 rounded-xl object-contain shadow-lg" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCrzbzN33kZvjkWczMi2MDJ1I1otD5b8X4OjxR27vMG2iAzXHeRSjvIBd678PC-CIp6AjJTaqY7oCwHL_pE2XLsuZk1hbpRHMQpkgkZmesGHAQ32zN50VenmI1G686MBKExtZ35ZVVVqGOPKS_CnVS2xwGcCoDfEd46uKdm9rsH7Dw4Zmm13X8Uc6GB3Sg6BlnkvWCee7BUnF1mZXifK8eNrfWdqtG6EbUU402MuHmUn2Es--SDsITQd9NfrNXzB-IFwJc1jo87qMZm">
<!-- Brand Name -->
<h1 class="font-display-lg text-on-primary mb-6 tracking-wide">THEMIS</h1>
<!-- Brand Statement -->
<p class="font-body-lg text-inverse-primary opacity-90 leading-relaxed">
                    Authoritative legal analytics and precision compliance monitoring for visionary professionals.
                </p>
</div>
</div>
<!-- Right Pane: Registration Form -->
<div class="w-full lg:w-1/2 flex items-center justify-center p-6 sm:p-12 lg:p-24 relative bg-surface-container-lowest">
<!-- Mobile Logo (Visible only on small screens) -->
<div class="absolute top-8 left-8 lg:hidden flex items-center gap-3">
<span class="material-symbols-outlined text-primary" style="font-size: 32px;">balance</span>
<span class="font-headline-md text-primary tracking-wide">THEMIS</span>
</div>
<!-- Form Container -->
<div class="w-full max-w-md border border-outline-variant rounded-xl p-8 shadow-sm bg-surface-container-lowest">
<!-- Header -->
<div class="mb-8">
<h2 class="font-headline-md text-on-surface mb-2">Đăng Ký</h2>
<p class="font-body-md text-on-surface-variant">Tạo tài khoản để truy cập hệ thống phân tích pháp lý.</p>
</div>
<!-- Form -->
<form action="#" class="flex flex-col gap-5" method="POST">
<!-- Họ tên (Full Name) -->
<div class="flex flex-col gap-1.5">
<label class="font-label-bold text-on-surface" for="fullname">Họ tên</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" style="font-size: 20px;">person</span>
<input class="w-full pl-10 pr-4 py-2.5 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow" id="fullname" name="fullname" placeholder="Nhập họ và tên đầy đủ" required="" type="text">
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-1.5">
<label class="font-label-bold text-on-surface" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" style="font-size: 20px;">mail</span>
<input class="w-full pl-10 pr-4 py-2.5 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow" id="email" name="email" placeholder="diachi@email.com" required="" type="email">
</div>
</div>
<!-- SĐT (Phone Number) -->
<div class="flex flex-col gap-1.5">
<label class="font-label-bold text-on-surface" for="phone">SĐT</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" style="font-size: 20px;">call</span>
<input class="w-full pl-10 pr-4 py-2.5 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow" id="phone" name="phone" placeholder="Nhập số điện thoại" required="" type="tel">
</div>
</div>
<!-- Mật khẩu (Password) -->
<div class="flex flex-col gap-1.5">
<label class="font-label-bold text-on-surface" for="password">Mật khẩu</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" style="font-size: 20px;">lock</span>
<input class="w-full pl-10 pr-4 py-2.5 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow" id="password" name="password" placeholder="Tạo mật khẩu an toàn" required="" type="password">
</div>
</div>
<!-- Xác nhận MK (Confirm Password) -->
<div class="flex flex-col gap-1.5">
<label class="font-label-bold text-on-surface" for="confirm_password">Xác nhận MK</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" style="font-size: 20px;">swipe_left_alt</span>
<input class="w-full pl-10 pr-4 py-2.5 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow" id="confirm_password" name="confirm_password" placeholder="Nhập lại mật khẩu" required="" type="password">
</div>
</div>
<!-- Submit Button -->
<button class="w-full mt-4 py-3 bg-primary text-on-primary font-label-bold rounded-lg hover:bg-on-primary-fixed-variant transition-colors flex items-center justify-center gap-2" type="submit">
<span>Đăng Ký</span>
<span class="material-symbols-outlined" style="font-size: 18px;">arrow_forward</span>
</button>
</form>
<!-- Footer Link -->
<div class="mt-8 text-center pt-6 border-t border-outline-variant/50">
<p class="font-body-md text-on-surface-variant">
                        Đã có tài khoản? 
                        <a class="text-primary font-label-bold hover:underline ml-1 transition-all" href="#">Đăng nhập</a>
</p>
</div>
</div>
