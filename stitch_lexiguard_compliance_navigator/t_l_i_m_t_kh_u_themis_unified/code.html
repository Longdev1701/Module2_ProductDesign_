<!DOCTYPE html><html lang="vi"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Themis - Đặt lại mật khẩu</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed-dim": "#b1c5ff",
                        "on-primary-container": "#a5bdff",
                        "surface-dim": "#d8dadc",
                        "surface-bright": "#f7f9fb",
                        "secondary-fixed": "#d6e3ff",
                        "tertiary": "#01401e",
                        "primary-fixed": "#dae2ff",
                        "secondary-fixed-dim": "#b9c7e4",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed-dim": "#99d4a4",
                        "on-error-container": "#93000a",
                        "tertiary-container": "#205833",
                        "on-surface-variant": "#434653",
                        "on-background": "#191c1e",
                        "background": "#f7f9fb",
                        "surface-container-highest": "#e0e3e5",
                        "inverse-on-surface": "#eff1f3",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#00419e",
                        "secondary-container": "#d2e0fe",
                        "surface-container-low": "#f2f4f6",
                        "inverse-surface": "#2d3133",
                        "on-primary": "#ffffff",
                        "error-container": "#ffdad6",
                        "primary": "#00327d",
                        "error": "#ba1a1a",
                        "surface-container-high": "#e6e8ea",
                        "outline-variant": "#c3c6d5",
                        "on-secondary-fixed": "#0d1c32",
                        "on-secondary-fixed-variant": "#39475f",
                        "on-primary-fixed": "#001946",
                        "secondary": "#515f78",
                        "on-tertiary-fixed": "#00210c",
                        "on-surface": "#191c1e",
                        "on-error": "#ffffff",
                        "surface": "#f7f9fb",
                        "surface-container": "#eceef0",
                        "on-tertiary-container": "#92cd9d",
                        "surface-tint": "#2559bd",
                        "surface-variant": "#e0e3e5",
                        "on-tertiary-fixed-variant": "#18512c",
                        "primary-container": "#0047ab",
                        "on-secondary-container": "#55637d",
                        "surface-container-lowest": "#ffffff",
                        "outline": "#737784",
                        "inverse-primary": "#b1c5ff",
                        "tertiary-fixed": "#b5f1bf"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin_mobile": "16px",
                        "margin_desktop": "40px",
                        "stack_sm": "8px",
                        "stack_lg": "32px",
                        "sidebar_width": "280px",
                        "gutter": "24px",
                        "container_max_width": "1440px",
                        "stack_md": "16px"
                    },
                    "fontFamily": {
                        "headline-md": ["Playfair Display"],
                        "code-sm": ["Inter"],
                        "headline-lg-mobile": ["Playfair Display"],
                        "headline-lg": ["Playfair Display"],
                        "body-lg": ["Inter"],
                        "display-lg": ["Playfair Display"],
                        "label-bold": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "code-sm": ["13px", { "lineHeight": "18px", "fontWeight": "500" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-bold": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]

                },
            }
        }
    </script>
<style>
        body {
            background-image: radial-gradient(circle at top right, rgba(0, 50, 125, 0.05) 0%, transparent 40%),
                              radial-gradient(circle at bottom left, rgba(0, 50, 125, 0.03) 0%, transparent 40%);
        }
    </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-margin_mobile md:p-margin_desktop font-body-md text-on-background">
<main class="w-full max-w-[480px]">
<!-- Logo -->
<div class="flex justify-center mb-stack_lg">
<img alt="Themis Logo" class="h-16 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBpgLQVKoQp4Yo0r08Q9pTERh9ME5ejMk3PVuIm6R11uB36ihC854SVpbzdBQshHBAf6fNHFvWo3Du_beztB8FhzGgKBKBhKqaYg6WDXsSYBf1s9rUaCjMdZYyDTrrLcwT6CZKFR1m16oWL2FHoJPYSMU8lP_SMNc1Qahu2YR9855_ibxAFY1eEI_fniI0q_8AE5LxnHqYouQlEkKOZnAE_AxDFjKL07VH43dH0qUFPWp9vpqvVLYK1NBcrlVGsApo-agMdpnGKr8t2">
</div>
<!-- Auth Card -->
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant p-margin_mobile md:p-margin_desktop shadow-[0_20px_40px_-15px_rgba(0,50,125,0.05)]">
<div class="text-center mb-stack_lg">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-stack_sm">Đặt lại mật khẩu</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Vui lòng nhập mật khẩu mới cho tài khoản của bạn.</p>
</div>
<form class="space-y-stack_md">
<!-- Mật khẩu mới -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-2" for="new_password">Mật khẩu mới</label>
<div class="relative">
<input class="w-full bg-surface px-4 py-3 rounded-lg border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all font-body-md text-body-md text-on-surface placeholder-on-surface-variant/50" id="new_password" placeholder="••••••••" type="password">
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center p-1" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Xác nhận mật khẩu mới -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-2" for="confirm_password">Xác nhận mật khẩu mới</label>
<div class="relative">
<input class="w-full bg-surface px-4 py-3 rounded-lg border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all font-body-md text-body-md text-on-surface placeholder-on-surface-variant/50" id="confirm_password" placeholder="••••••••" type="password">
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center p-1" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<div class="pt-stack_sm">
<button class="w-full flex items-center justify-center gap-2 bg-primary hover:bg-primary/90 text-on-primary font-label-bold text-label-bold py-3.5 px-6 rounded-lg transition-colors focus:ring-2 focus:ring-offset-2 focus:ring-primary" type="submit">
                        Cập nhật mật khẩu
                        <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<!-- Back Link -->
<div class="mt-stack_lg text-center">
<a class="inline-flex items-center gap-2 font-label-bold text-label-bold text-primary hover:text-primary-container transition-colors group" href="#">
<span class="material-symbols-outlined text-[18px] transition-transform group-hover:-translate-x-1" data-icon="arrow_back">arrow_back</span>
                    Quay lại Đăng nhập
                </a>
</div>
</div>
</main>
</body></html>
